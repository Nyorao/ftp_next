# OAR-Spine prototype: tissue/level factorization + ordinal ambiguity routing.
# Fixed screening budget matches existing 6000-step controls. No test-driven selection.
schema_version: 3
root_path: ${SPIDER_PNG_ROOT:-/data/zhp/dateset_spine copy/spider/slice_png_order}
output_dir: outputs/spine_ordinal_screening
method: dual_ordinal
num_classes: 20
image_size: 224
base_channels: 32
max_channels: 256
labelnum: 1496
max_samples: 3732
batch_size: 8
labeled_bs: 4
num_workers: 0
seed: 42
max_steps: 6000
eval_every: 500
log_every: 25
base_lr: 0.0003
weight_decay: 0.0001
ema_decay: 0.99
warmup_steps: 600
ramp_steps: 1200
unsupervised_weight: 1.0
confidence: 0.8
background_confidence: 0.95
background_weight: 0.25
pseudo_dice_weight: 0.0
region_weight: 0.0
ordinal_tissue_weight: 0.25
ordinal_chain_threshold: 0.5
ordinal_interval_mass: 0.8
ordinal_max_interval: 3
ordinal_bins: 56
ordinal_use_chain: true
ordinal_use_routing: true
frequency_strength: 0.0
noise_std: 0.08
gain_std: 0.15
cutmix_probability: 0.5
grad_clip: 12.0
amp: false
deterministic: true
cpu_threads: 4
eval_batch_size: 8
max_seconds: 14400
